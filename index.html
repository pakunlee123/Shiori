<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHIORI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>SHIORI — 暮らしに、しおりを。</title>
<style>
:root{--bg:#f6f7fa;--card:#fff;--ink:#20232a;--muted:#858b98;--line:#e9ebf0;--blue:#7898ee;--blue2:#eaf0ff;--peach:#f4c4b5;--green:#8fc1a5;--purple:#c5b7e7;--shadow:0 10px 30px rgba(35,42,58,.06);--r:23px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans TC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}
.side{width:235px;padding:28px 18px;border-right:1px solid var(--line);background:rgba(255,255,255,.78);position:fixed;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 35px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#7593e8,#aabaf0);display:grid;place-items:center;color:#fff;font-weight:700}.brand b{letter-spacing:3px;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;margin-top:2px}.nav button{width:100%;padding:13px 14px;margin:4px 0;background:transparent;border-radius:15px;text-align:left;color:#747b88}.nav button.active{background:var(--blue2);color:#4d6dc0;font-weight:600}.nav span{margin-right:10px}
.main{width:100%;max-width:1180px;margin-left:235px;padding:30px 34px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.hello small{color:var(--muted)}.hello h1{font-size:25px;margin:4px 0}.avatar{width:42px;height:42px;border-radius:50%;background:#e8ecf7;display:grid;place-items:center;color:#6174a9}
.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.monthbar button{width:38px;height:38px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#65708a}.monthlabel{text-align:center}.monthlabel b{display:block;font-size:18px}.monthlabel small{color:var(--muted)}
.saving{background:linear-gradient(135deg,#7898ee,#a8b9f1);color:#fff;border:0;min-height:230px;position:relative;overflow:hidden}.saving:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-75px;top:-80px;background:rgba(255,255,255,.11)}.eyebrow{font-size:12px;opacity:.82}.big{font-size:43px;font-weight:650;letter-spacing:-2px;margin:12px 0}.goalrow{display:flex;justify-content:space-between;font-size:13px;opacity:.9}.bar{height:9px;background:rgba(255,255,255,.35);border-radius:20px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{padding:18px;border:1px solid var(--line);border-radius:19px;background:#fff}.stat small{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sectionhead h2{font-size:17px;margin:0}.link{color:#6076bd;background:none}
.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--blue) 0 36%,var(--peach) 36% 58%,var(--green) 58% 73%,var(--purple) 73% 86%,#dfe2e8 86%);position:relative;margin:10px auto 18px}.donut:after{content:"¥0";position:absolute;inset:27px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:650}.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:#666}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--blue)}
.rows{display:grid;gap:9px}.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.ico{width:40px;height:40px;border-radius:14px;background:#f0f3fb;display:grid;place-items:center}.tx main{flex:1}.tx b{font-size:14px}.tx small{display:block;color:var(--muted);margin-top:3px}.amt{font-weight:650}
.empty{text-align:center;padding:42px 15px;color:var(--muted)}.empty .emptyicon{font-size:36px;margin-bottom:10px}.empty b{display:block;color:#555;margin-bottom:6px}.insight{background:#faf7f4}.insight p{line-height:1.7;margin:7px 0;color:#555;font-size:14px}
.fab{position:fixed;right:32px;bottom:28px;width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;font-size:31px;box-shadow:0 12px 30px rgba(80,105,180,.3);z-index:5}.mobile-nav{display:none}
.modal{position:fixed;inset:0;background:rgba(20,25,35,.35);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#fff;width:min(570px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px}.close{float:right;width:38px;height:38px;border-radius:50%;background:#f3f5f8}.sheet h2{margin:0 0 5px}.sheet p{color:var(--muted);font-size:13px}.upload{border:1.5px dashed #cdd3df;border-radius:20px;padding:25px;text-align:center;margin:18px 0;background:#fafbfe}.upload input{display:none}.upload label{display:block;color:#5670c1;font-weight:600}.form{display:grid;gap:10px}.form label{font-size:12px;color:#777;margin-top:4px}.form input,.form select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fafbfc}.savebtn{padding:14px;border-radius:16px;background:var(--blue);color:#fff;font-weight:650}.paycards{display:grid;gap:9px}.paycard{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:15px}.paycard span{flex:1}.danger{background:#fff1f1;color:#b45c5c;padding:12px 14px;border-radius:14px}.compare{width:100%;border-collapse:collapse;font-size:13px}.compare th,.compare td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right}.compare th:first-child,.compare td:first-child{text-align:left}.compare th{color:var(--muted);font-weight:500}.pill{display:inline-block;padding:5px 9px;border-radius:10px;background:#f1f3f7;color:#666;font-size:11px}.monthlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.monthcard{padding:17px;border:1px solid var(--line);border-radius:17px;background:#fff}.monthcard b{display:block;font-size:15px}.monthcard strong{display:block;margin-top:8px;font-size:20px}.monthcard small{color:var(--muted)}
@media(max-width:800px){.side{display:none}.main{margin:0;padding:19px 16px 105px}.top{margin-bottom:16px}.grid{display:block}.grid>*{margin-bottom:14px}.saving{min-height:220px}.big{font-size:37px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:18px}.card{padding:18px;border-radius:21px}.mobile-nav{display:flex;position:fixed;z-index:6;left:12px;right:12px;bottom:12px;height:68px;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);justify-content:space-around;align-items:center}.mobile-nav button{background:none;color:#7c8390;font-size:11px}.mobile-nav button.active{color:#5571c4;font-weight:650}.mobile-nav .plus{width:48px;height:48px;border-radius:17px;background:var(--blue);color:#fff;font-size:24px}.fab{display:none}.monthlist{grid-template-columns:1fr 1fr}.compare{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">栞</div><div><b>SHIORI</b><small>暮らしに、しおりを。</small></div></div>
  <nav class="nav">
    <button class="active" data-page="home"><span>⌂</span>首頁</button>
    <button data-page="transactions"><span>▤</span>記錄</button>
    <button data-page="months"><span>◫</span>月份</button>
    <button data-page="analytics"><span>◔</span>分析</button>
    <button data-page="settings"><span>⚙</span>設定</button>
  </nav>
</aside>

<main class="main">
<div class="top"><div class="hello"><small id="dateText"></small><h1>Good evening.</h1></div><div class="avatar">栞</div></div>

<section id="home" class="page active">
  <div class="monthbar">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="monthlabel"><b id="homeMonth"></b><small>今月の記錄</small></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="grid">
    <div>
      <div class="card saving">
        <div class="eyebrow">今月の貯蓄目標</div>
        <div class="big" id="goalAmount">¥0</div>
        <div class="goalrow"><span id="savedText">尚未設定目標</span><span id="goalPct">0%</span></div>
        <div class="bar"><i id="goalBar"></i></div>
        <div style="margin-top:30px;font-size:13px;opacity:.9" id="dailyHint">設定儲蓄目標後，SHIORI 會幫你計算。</div>
      </div>
      <div class="stats">
        <div class="stat"><small>今月支出</small><strong id="monthTotal">¥0</strong></div>
        <div class="stat"><small>今週支出</small><strong id="weekTotal">¥0</strong></div>
        <div class="stat"><small>今日支出</small><strong id="dayTotal">¥0</strong></div>
      </div>
      <div class="card" style="margin-top:18px">
        <div class="sectionhead"><h2>最近の記錄</h2><button class="link" data-page="transactions">查看全部</button></div>
        <div id="recentTx"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="sectionhead"><h2>今月の支出</h2><span class="pill" id="monthPill"></span></div>
        <div class="donut" id="donut"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card insight" style="margin-top:18px"><div class="sectionhead"><h2>SHIORI insight</h2>✦</div><div id="insight"></div></div>
    </div>
  </div>
</section>

<section id="transactions" class="page">
  <div class="card">
    <div class="sectionhead"><h2>記錄</h2><button class="link" onclick="openModal()">＋ 記一筆</button></div>
    <div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div class="monthlabel"><b id="txMonth"></b><small>這個月份</small></div><button onclick="changeMonth(1)">›</button></div>
    <div class="rows" id="allTx"></div>
  </div>
</section>

<section id="months" class="page">
  <div class="card">
    <div class="sectionhead"><h2>月份</h2><span class="pill">所有記錄</span></div>
    <p style="color:var(--muted);font-size:13px">每筆交易會自動歸入所屬月份，毋須手動開新帳戶。</p>
    <div class="monthlist" id="monthList"></div>
  </div>
  <div class="card" style="margin-top:18px">
    <div class="sectionhead"><h2>最近 3 個月比較</h2></div>
    <div style="overflow:auto"><table class="compare"><thead><tr><th>項目</th><th id="c0"></th><th id="c1"></th><th id="c2"></th></tr></thead><tbody id="compareBody"></tbody></table></div>
  </div>
</section>

<section id="analytics" class="page">
  <div class="card">
    <div class="sectionhead"><h2>分析</h2></div>
    <div class="tabs" style="display:flex;gap:8px;margin-bottom:18px"><button class="tab active" onclick="setPeriod('day',this)">每日</button><button class="tab" onclick="setPeriod('week',this)">每週</button><button class="tab" onclick="setPeriod('month',this)">每月</button></div>
    <div class="stats">
      <div class="stat"><small>支出</small><strong id="aTotal">¥0</strong></div>
      <div class="stat"><small>交易次數</small><strong id="aCount">0</strong></div>
      <div class="stat"><small>平均每筆</small><strong id="aAvg">¥0</strong></div>
    </div>
    <div class="donut" id="aDonut" style="margin-top:25px"></div>
    <div class="legend" id="aLegend"></div>
  </div>
</section>

<section id="settings" class="page">
  <div class="card">
    <div class="sectionhead"><h2>儲蓄設定</h2></div>
    <div class="form">
      <label>每月儲蓄目標（JPY）</label><input id="goalInput" type="number" min="0" placeholder="例如 150000">
      <label>每月收入（可選）</label><input id="incomeInput" type="number" min="0" placeholder="例如 300000">
      <label>固定支出（可選）</label><input id="fixedInput" type="number" min="0" placeholder="例如 68000">
      <button class="savebtn" onclick="saveSettings()">儲存設定</button>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="sectionhead"><h2>💳 信用卡</h2><button class="link" onclick="addCard()">＋ 新增</button></div>
    <p>只需要輸入信用卡名稱，不儲存卡號。</p>
    <div class="paycards" id="cards"></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="sectionhead"><h2>資料管理</h2></div>
    <button class="savebtn" onclick="exportCSV()" style="width:100%;margin-bottom:9px">匯出 CSV</button>
    <button class="danger" onclick="resetData()" style="width:100%">清除全部資料</button>
  </div>
</section>
</main>
</div>

<button class="fab" onclick="openModal()">＋</button>
<div class="mobile-nav">
<button class="active" data-page="home">⌂<br>首頁</button>
<button data-page="transactions">▤<br>記錄</button>
<button class="plus" onclick="openModal()">＋</button>
<button data-page="months">◫<br>月份</button>
<button data-page="analytics">◔<br>分析</button>
</div>

<div class="modal" id="modal">
<div class="sheet">
<button class="close" onclick="closeModal()">×</button>
<h2>記一筆</h2><p>留下今天的生活書籤。</p>
<div class="upload"><input id="receipt" type="file" accept="image/*" capture="environment"><label for="receipt">📷 拍攝／上傳收據</label><div id="preview" style="margin-top:10px"></div></div>
<div class="form">
<input id="merchant" placeholder="商戶名稱，例如 セブン-イレブン">
<input id="amount" type="number" min="0" placeholder="金額（JPY）">
<select id="category"><option>飲食</option><option>交通</option><option>日用品</option><option>購物</option><option>娛樂</option><option>住宿</option><option>通訊</option><option>醫療</option><option>工作</option><option>其他</option></select>
<select id="payment" onchange="toggleCardSelect()"><option>信用卡</option><option>PayPay</option><option>現金</option><option>IC Card</option></select>
<div id="cardWrap"></div>
<input id="note" placeholder="備註（可選）">
<button class="savebtn" onclick="addTx()">確認記帳</button>
</div>
</div>
</div>

<script>
const KEY_TX="shiori-txs-v2",KEY_SETTINGS="shiori-settings-v2",KEY_CARDS="shiori-cards-v2";
let txs=JSON.parse(localStorage.getItem(KEY_TX)||"[]");
let settings=JSON.parse(localStorage.getItem(KEY_SETTINGS)||'{"goal":0,"income":0,"fixed":0}');
let cards=JSON.parse(localStorage.getItem(KEY_CARDS)||"[]");
let viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let period="day";

const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP");
const monthKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")};
const monthText=d=>new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long"}).format(d);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
 document.querySelectorAll("[data-page]").forEach(n=>n.classList.toggle("active",n.dataset.page===id));
 render();
}
document.querySelectorAll("[data-page]").forEach(n=>n.addEventListener("click",()=>showPage(n.dataset.page)));

function changeMonth(delta){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+delta,1);render()}
function txForMonth(d=viewMonth){const k=monthKey(d);return txs.filter(t=>monthKey(t.date)===k)}
function sum(a){return a.reduce((s,t)=>s+Number(t.amount||0),0)}
function categoryTotals(list){return list.reduce((o,t)=>(o[t.category]=(o[t.category]||0)+Number(t.amount||0),o),{})}
const cats=[["飲食","#7898ee"],["購物","#f4c4b5"],["交通","#8fc1a5"],["日用品","#c5b7e7"],["娛樂","#d7a6c4"],["住宿","#aeb9c8"],["其他","#dfe2e8"]];

function render(){
 const mtx=txForMonth(), total=sum(mtx);
 $("homeMonth").textContent=monthText(viewMonth);$("txMonth").textContent=monthText(viewMonth);$("monthPill").textContent=monthKey(viewMonth);
 $("monthTotal").textContent=yen(total);
 const now=new Date(), todayKey=now.toISOString().slice(0,10);
 $("dayTotal").textContent=yen(txs.filter(t=>t.date.slice(0,10)===todayKey).reduce((s,t)=>s+Number(t.amount),0));
 const weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);
 $("weekTotal").textContent=yen(txs.filter(t=>new Date(t.date)>=weekStart).reduce((s,t)=>s+Number(t.amount),0));

 const goal=Number(settings.goal||0), pct=goal?Math.min(100,(Math.max(0,goal-total)/goal)*100):0;
 $("goalAmount").textContent=goal?yen(Math.max(0,goal-total)):"¥0";
 $("savedText").textContent=goal?`距離目標還有 ${yen(Math.max(0,goal-total))}`:"尚未設定目標";
 $("goalPct").textContent=goal?Math.round(Math.min(100,total/goal)*100)+"%":"0%";
 $("goalBar").style.width=goal?Math.min(100,total/goal)*100+"%":"0%";
 $("dailyHint").textContent=goal?`目標 ¥${goal.toLocaleString()} · 目前支出 ${yen(total)}。`: "設定儲蓄目標後，SHIORI 會幫你計算。";

 renderRecent(mtx);renderDonut(mtx,"donut","legend");renderInsight(mtx,total);
 $("allTx").innerHTML=mtx.length?mtx.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(txHtml).join(""):emptyHtml("這個月還沒有記錄","按 ＋ 開始記下第一筆生活支出。");
 renderMonths();renderCompare();renderAnalytics();renderCards();
 $("goalInput").value=settings.goal||"";$("incomeInput").value=settings.income||"";$("fixedInput").value=settings.fixed||"";
}

function emptyHtml(title,text){return `<div class="empty"><div class="emptyicon">栞</div><b>${title}</b><span>${text}</span></div>`}
function txHtml(t){
 const icon=t.category==="交通"?"🚃":t.category==="購物"?"🛍️":t.category==="娛樂"?"🎮":t.category==="日用品"?"🧴":t.category==="住宿"?"🏨":"🍜";
 const card=t.payment==="信用卡"&&t.card?` · ${escapeHtml(t.card)}`:"";
 return `<div class="tx"><div class="ico">${icon}</div><main><b>${escapeHtml(t.merchant)}</b><small>${escapeHtml(t.category)} · ${escapeHtml(t.payment)}${card} · ${new Date(t.date).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}${t.note?" · "+escapeHtml(t.note):""}</small></main><div class="amt">${yen(t.amount)}</div></div>`;
}
function renderRecent(mtx){$("recentTx").innerHTML=mtx.length?mtx.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4).map(txHtml).join(""):emptyHtml("還沒有支出","今天開始記一筆吧。")}

function renderDonut(list,donutId,legendId){
 const total=sum(list), ct=categoryTotals(list);
 if(!total){$(donutId).style.background="#e9ebf0";$(legendId).innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999">還沒有支出分類</div>';return}
 let cur=0, parts=[];
 cats.forEach(([c,col])=>{const v=ct[c]||0;if(v){const start=cur;cur+=v/total*100;parts.push(`${col} ${start}% ${cur}%`)}});
 $(donutId).style.background=`conic-gradient(${parts.join(",")})`;
 $(donutId).style.setProperty("--dummy","1");
 $(legendId).innerHTML=cats.filter(([c])=>ct[c]).map(([c,col])=>`<div><i class="dot" style="background:${col}"></i>${c}　${Math.round(ct[c]/total*100)}%</div>`).join("");
}
function renderInsight(list,total){
 if(!list.length){$("insight").innerHTML="<p>目前沒有支出資料。當你開始記帳後，我會幫你找出主要支出。</p>";return}
 const ct=categoryTotals(list), top=Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];
 $("insight").innerHTML=`<p>今月最主要支出係 <strong>${escapeHtml(top[0])}</strong>，佔 ${Math.round(top[1]/total*100)}%，共 ${yen(top[1])}。</p><p>今月共有 <strong>${list.length}</strong> 筆交易，平均每筆 <strong>${yen(total/list.length)}</strong>。</p>`;
}

function renderMonths(){
 const keys=[...new Set(txs.map(t=>monthKey(t.date)))].sort().reverse();
 const current=monthKey(new Date());
 if(!keys.includes(current))keys.unshift(current);
 $("monthList").innerHTML=keys.map(k=>{const total=sum(txs.filter(t=>monthKey(t.date)===k));return `<button class="monthcard" onclick="jumpMonth('${k}')"><b>${k}</b><strong>${yen(total)}</strong><small>${txs.filter(t=>monthKey(t.date)===k).length} 筆交易</small></button>`}).join("");
}
function jumpMonth(k){const [y,m]=k.split("-").map(Number);viewMonth=new Date(y,m-1,1);showPage("home")}

function prevMonth(d,n){return new Date(d.getFullYear(),d.getMonth()-n,1)}
function compareMonth(d){return txs.filter(t=>monthKey(t.date)===monthKey(d))}
function renderCompare(){
 const ds=[prevMonth(viewMonth,2),prevMonth(viewMonth,1),viewMonth];
 ds.forEach((d,i)=>$("c"+i).textContent=monthKey(d));
 const rows=["總支出",...cats.map(x=>x[0])];
 $("compareBody").innerHTML=rows.map(label=>{
   const vals=ds.map(d=>{const a=compareMonth(d);return label==="總支出"?sum(a):categoryTotals(a)[label]||0});
   return `<tr><td>${label}</td>${vals.map(v=>`<td>${yen(v)}</td>`).join("")}</tr>`;
 }).join("");
}

function setPeriod(p,el){period=p;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");renderAnalytics()}
function renderAnalytics(){
 const now=new Date();let list=[];
 if(period==="day"){const k=now.toISOString().slice(0,10);list=txs.filter(t=>t.date.slice(0,10)===k)}
 else if(period==="week"){const s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));s.setHours(0,0,0,0);list=txs.filter(t=>new Date(t.date)>=s)}
 else list=txForMonth();
 const total=sum(list);$("aTotal").textContent=yen(total);$("aCount").textContent=list.length;$("aAvg").textContent=yen(list.length?total/list.length:0);
 renderDonut(list,"aDonut","aLegend");
}

function renderCards(){
 $("cards").innerHTML=cards.length?cards.map((c,i)=>`<div class="paycard"><span>💳 ${escapeHtml(c)}</span><button class="link" onclick="removeCard(${i})">刪除</button></div>`).join(""):'<div class="empty" style="padding:22px">尚未加入信用卡</div>';
 toggleCardSelect();
}
function addCard(){const name=prompt("輸入信用卡名稱");if(!name||!name.trim())return;cards.push(name.trim());localStorage.setItem(KEY_CARDS,JSON.stringify(cards));render()}
function removeCard(i){if(confirm(`刪除「${cards[i]}」？`)){cards.splice(i,1);localStorage.setItem(KEY_CARDS,JSON.stringify(cards));render()}}
function toggleCardSelect(){
 const isCard=$("payment")?.value==="信用卡";
 $("cardWrap").innerHTML=isCard?`<select id="card">${cards.length?cards.map(c=>`<option>${escapeHtml(c)}</option>`).join(""):"<option value="">請先到設定新增信用卡</option>"}</select>`:"";
}

function openModal(){ $("modal").style.display="flex";toggleCardSelect() }
function closeModal(){ $("modal").style.display="none" }
$("receipt").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("preview").innerHTML=`<img src="${r.result}" style="max-width:100%;max-height:180px;border-radius:14px">`};r.readAsDataURL(f)});

function addTx(){
 const merchant=$("merchant").value.trim()||"未設定",amount=Number($("amount").value||0);
 if(!amount){alert("請輸入金額");return}
 if($("payment").value==="信用卡"&&!cards.length){alert("請先到「設定」新增信用卡名稱。");return}
 const t={id:Date.now(),date:new Date().toISOString(),merchant,amount,category:$("category").value,payment:$("payment").value,card:$("payment").value==="信用卡"?$("card").value:"",note:$("note").value.trim()};
 txs.unshift(t);localStorage.setItem(KEY_TX,JSON.stringify(txs));closeModal();resetForm();viewMonth=new Date(new Date(t.date).getFullYear(),new Date(t.date).getMonth(),1);showPage("transactions");
}
function resetForm(){["merchant","amount","note"].forEach(id=>$(id).value="");$("receipt").value="";$("preview").innerHTML=""}

function saveSettings(){settings={goal:Number($("goalInput").value||0),income:Number($("incomeInput").value||0),fixed:Number($("fixedInput").value||0)};localStorage.setItem(KEY_SETTINGS,JSON.stringify(settings));alert("已儲存");render()}
function exportCSV(){
 const rows=[["date","merchant","amountJPY","category","payment","card","note"],...txs.map(t=>[t.date,t.merchant,t.amount,t.category,t.payment,t.card||"",t.note||""])];
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="shiori-transactions.csv";a.click();URL.revokeObjectURL(a.href);
}
function resetData(){if(confirm("確定要清除 SHIORI 所有交易、設定及信用卡資料嗎？此操作無法復原。")){localStorage.removeItem(KEY_TX);localStorage.removeItem(KEY_SETTINGS);localStorage.removeItem(KEY_CARDS);location.reload()}}

$("dateText").textContent=new Intl.DateTimeFormat("zh-HK",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
