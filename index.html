<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHIORI">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>SHIORI — 家計簿</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#22252c;--muted:#9297a2;--line:#eceef2;--blue:#7899ec;--blue-soft:#edf1ff;--shadow:0 10px 28px rgba(38,48,70,.055);--radius:23px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans TC",sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:218px;padding:30px 18px;background:rgba(255,255,255,.9);border-right:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:3px 10px 32px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#7795e6,#a9baf0);color:white;font-weight:700}
.brand b{display:block;letter-spacing:3px;font-size:15px}.brand small{display:block;color:#9a9eaa;font-size:9px;letter-spacing:1px;margin-top:2px}
.nav{display:grid;gap:4px}.nav button{height:46px;border-radius:15px;background:transparent;color:#7c828e;text-align:left;padding:0 13px;font-size:15px}.nav button.active{background:var(--blue-soft);color:#5873c4;font-weight:650}.nav button span{display:inline-block;width:24px;color:inherit}
.main{margin-left:218px;padding:34px 36px 65px;max-width:1350px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.header small{color:#8f94a0;font-size:13px}.header h1{margin:4px 0 0;font-size:25px;letter-spacing:-.6px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#edf0fa;color:#6078bd}
.page{display:none}.page.active{display:block}
.monthbar{height:46px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:14px}.monthbar .arrow{position:absolute;width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:13px;color:#78808f}.monthbar .prev{left:0}.monthbar .next{right:0}.monthname{text-align:center}.monthname b{font-size:17px}.monthname small{display:block;color:#9a9ea8;font-size:12px;margin-top:2px}
.dashboard{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.72fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.hero{min-height:235px;border:0;color:white;background:linear-gradient(135deg,#7898eb,#a9b9ef);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:245px;height:245px;right:-82px;top:-105px;border-radius:50%;background:rgba(255,255,255,.10)}
.eyebrow{font-size:12px;opacity:.86}.heroAmount{font-size:42px;font-weight:700;letter-spacing:-2px;margin:13px 0 11px}.heroRow{display:flex;justify-content:space-between;font-size:13px;opacity:.9}.progress{height:9px;border-radius:10px;background:rgba(255,255,255,.38);margin-top:9px;overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:10px;background:white}.heroBottom{margin-top:28px;font-size:13px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{min-height:94px}.stat small{color:#9297a2;font-size:12px}.stat strong{display:block;font-size:21px;margin-top:10px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionHead h2{font-size:17px;margin:0}.textBtn{background:none;color:#6078c0;font-size:13px}
.recent .tx{padding:12px 0}.tx{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.txIcon{width:40px;height:40px;flex:none;border-radius:14px;background:#f1f4fa;display:grid;place-items:center}.txBody{flex:1;min-width:0}.txBody b{font-size:14px}.txBody small{display:block;color:#969ba5;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txAmt{font-size:14px;font-weight:650}
.donut{width:170px;height:170px;border-radius:50%;margin:14px auto 20px;position:relative;background:#e5e8ee}.donut:after{content:"¥0";position:absolute;inset:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:700}.legend{display:grid;grid-template-columns:1fr 1fr;gap:11px;font-size:12px;color:#666}.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.insight{background:#fcfaf8}.insight p{margin:6px 0;color:#5f6269;font-size:13px;line-height:1.7}
.empty{text-align:center;padding:35px 12px;color:#9a9ea7;font-size:13px}.empty b{display:block;color:#555;margin-bottom:5px}.empty .emptyMark{font-size:28px;margin-bottom:8px}
.listCard .monthbar{margin:8px 0 15px}.allTx{display:grid}
.monthGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.monthCard{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;text-align:left}.monthCard b{font-size:14px}.monthCard strong{display:block;font-size:19px;margin-top:9px}.monthCard small{display:block;color:#969ba5;margin-top:4px}
.compareWrap{overflow:auto}.compare{width:100%;border-collapse:collapse;font-size:13px}.compare th,.compare td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.compare th:first-child,.compare td:first-child{text-align:left}.compare th{color:#9297a2;font-weight:500}
.tabs{display:flex;gap:7px;margin-bottom:18px}.tab{background:#f4f5f8;color:#858a94;padding:9px 15px;border-radius:12px;font-size:12px}.tab.active{background:var(--blue-soft);color:#5873c4;font-weight:650}
.form{display:grid;gap:9px}.form label{font-size:12px;color:#858a94;margin-top:4px}.form input,.form select{width:100%;height:45px;border:1px solid var(--line);background:#fafbfc;border-radius:14px;padding:0 13px;color:#333}.primary{height:46px;border-radius:15px;background:var(--blue);color:white;font-weight:650}.cards{display:grid;gap:8px}.savedCard{display:flex;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px;gap:10px}.savedCard span{flex:1}.deleteBtn{background:#fff0f0;color:#ae5e5e;padding:7px 10px;border-radius:10px;font-size:12px}
.fab{position:fixed;right:28px;bottom:28px;width:61px;height:61px;border-radius:50%;background:var(--blue);color:white;font-size:29px;box-shadow:0 12px 28px rgba(86,111,184,.3);z-index:6}
.mobileNav{display:none}
.modal{position:fixed;inset:0;background:rgba(25,30,40,.34);backdrop-filter:blur(5px);z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet{width:min(570px,100%);max-height:92vh;overflow:auto;background:white;border-radius:28px 28px 0 0;padding:23px}.close{float:right;width:38px;height:38px;border-radius:50%;background:#f3f5f8;color:#777;font-size:23px}.sheet h2{margin:0 0 5px}.sheet p{font-size:13px;color:#959aa4}.receiptBox{border:1.5px dashed #cfd4df;background:#fafbfe;border-radius:19px;padding:23px;text-align:center;margin:17px 0}.receiptBox input{display:none}.receiptBox label{color:#5873c4;font-weight:650;cursor:pointer}.preview img{max-width:100%;max-height:170px;border-radius:13px;margin-top:10px}
@media(max-width:850px){
.sidebar{display:none}.main{margin-left:0;padding:20px 15px 105px}.header{margin-bottom:13px}.header h1{font-size:23px}.dashboard{display:block}.dashboard>div{margin-bottom:14px}.card{padding:18px;border-radius:21px}.hero{min-height:220px}.heroAmount{font-size:38px}.stats{gap:8px}.stat{padding:15px}.stat strong{font-size:18px}.mobileNav{position:fixed;display:flex;left:11px;right:11px;bottom:11px;height:67px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:23px;z-index:7;justify-content:space-around;align-items:center;box-shadow:var(--shadow)}.mobileNav button{background:none;color:#808692;font-size:10px}.mobileNav button.active{color:#5873c4;font-weight:650}.mobileNav .plus{width:47px;height:47px;border-radius:17px;background:var(--blue);color:#fff;font-size:24px}.fab{display:none}.monthGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><div class="logo">栞</div><div><b>SHIORI</b><small>暮らしに、しおりを。</small></div></div>
  <nav class="nav">
    <button class="active" data-page="home"><span>⌂</span>ホーム</button>
    <button data-page="transactions"><span>▤</span>記録</button>
    <button data-page="months"><span>◫</span>月別</button>
    <button data-page="analytics"><span>◔</span>分析</button>
    <button data-page="settings"><span>⚙</span>設定</button>
  </nav>
</aside>

<main class="main">
  <header class="header">
    <div><small id="dateText"></small><h1>こんばんは。</h1></div>
    <div class="avatar">栞</div>
  </header>

  <section id="home" class="page active">
    <div class="monthbar">
      <button class="arrow prev" id="prevHome">‹</button>
      <div class="monthname"><b id="homeMonth"></b><small>今月の記録</small></div>
      <button class="arrow next" id="nextHome">›</button>
    </div>
    <div class="dashboard">
      <div>
        <div class="card hero">
          <div class="eyebrow">今月の貯蓄目標</div>
          <div class="heroAmount" id="goalAmount">¥0</div>
          <div class="heroRow"><span id="goalText">目標未設定</span><span id="goalPct">0%</span></div>
          <div class="progress"><i id="goalProgress"></i></div>
          <div class="heroBottom" id="goalHint">貯蓄目標を設定すると、SHIORIが進捗を表示します。</div>
        </div>
        <div class="stats">
          <div class="card stat"><small>今月の支出</small><strong id="monthTotal">¥0</strong></div>
          <div class="card stat"><small>今週の支出</small><strong id="weekTotal">¥0</strong></div>
          <div class="card stat"><small>今日の支出</small><strong id="dayTotal">¥0</strong></div>
        </div>
        <div class="card recent" style="margin-top:18px">
          <div class="sectionHead"><h2>最近の記録</h2><button class="textBtn" data-page="transactions">すべて見る</button></div>
          <div id="recentTx"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="sectionHead"><h2>今月の支出</h2><span id="monthPill" style="color:#999;font-size:12px"></span></div>
          <div class="donut" id="donut"></div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="card insight" style="margin-top:18px">
          <div class="sectionHead"><h2>SHIORI insight</h2><span>✦</span></div>
          <div id="insight"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="transactions" class="page">
    <div class="card listCard">
      <div class="sectionHead"><h2>記録</h2><button class="textBtn" id="recordBtn">＋ 支出を記録</button></div>
      <div class="monthbar"><button class="arrow prev" id="prevTx">‹</button><div class="monthname"><b id="txMonth"></b><small>這個月別</small></div><button class="arrow next" id="nextTx">›</button></div>
      <div class="allTx" id="allTx"></div>
    </div>
  </section>

  <section id="months" class="page">
    <div class="card">
      <div class="sectionHead"><h2>月別</h2><span style="color:#999;font-size:12px">所有記録</span></div>
      <p style="color:#969ba5;font-size:13px">每件會按日期自動歸入月別。</p>
      <div class="monthGrid" id="monthList"></div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="sectionHead"><h2>最近3ヶ月の比較</h2></div>
      <div class="compareWrap"><table class="compare"><thead><tr><th>項目</th><th id="c0"></th><th id="c1"></th><th id="c2"></th></tr></thead><tbody id="compareBody"></tbody></table></div>
    </div>
  </section>

  <section id="analytics" class="page">
    <div class="card">
      <div class="sectionHead"><h2>分析</h2></div>
      <div class="tabs"><button class="tab active" data-period="day">日別</button><button class="tab" data-period="week">週別</button><button class="tab" data-period="month">月別</button></div>
      <div class="stats" style="margin-top:0">
        <div class="card stat"><small>支出</small><strong id="aTotal">¥0</strong></div>
        <div class="card stat"><small>取引件数</small><strong id="aCount">0</strong></div>
        <div class="card stat"><small>1件あたり</small><strong id="aAvg">¥0</strong></div>
      </div>
      <div class="donut" id="aDonut" style="margin-top:25px"></div>
      <div class="legend" id="aLegend"></div>
    </div>
  </section>

  <section id="settings" class="page">
    <div class="card">
      <div class="sectionHead"><h2>貯蓄設定</h2></div>
      <div class="form">
        <label>月別儲蓄目標（JPY）</label><input id="goalInput" type="number" min="0" placeholder="例如 150000">
        <label>月別收入（可選）</label><input id="incomeInput" type="number" min="0" placeholder="例如 300000">
        <label>固定支出（任意）</label><input id="fixedInput" type="number" min="0" placeholder="例如 68000">
        <button class="primary" id="saveSettingsBtn">設定を保存</button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sectionHead"><h2>💳 クレジットカード</h2><button class="textBtn" id="addCardBtn">＋ 追加</button></div>
      <p style="color:#969ba5;font-size:13px">只需要輸入クレジットカード名稱，不儲存卡號。</p>
      <div class="cards" id="cards"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sectionHead"><h2>データ管理</h2></div>
      <button class="primary" id="exportBtn" style="width:100%;margin-bottom:9px">CSVを書き出す</button>
      <button class="deleteBtn" id="resetBtn" style="width:100%;height:44px">すべてのデータを削除</button>
    </div>
  </section>
</main>

<div class="mobileNav">
  <button class="active" data-page="home">⌂<br>ホーム</button>
  <button data-page="transactions">▤<br>記録</button>
  <button class="plus" id="mobileAdd">＋</button>
  <button data-page="months">◫<br>月別</button>
  <button data-page="analytics">◔<br>分析</button>
</div>
<button class="fab" id="desktopAdd">＋</button>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" id="closeModal">×</button>
    <h2>支出を記録</h2><p>留下今日的生活書籤。</p>
    <div class="receiptBox">
      <input id="receipt" type="file" accept="image/*" capture="environment">
      <label for="receipt">📷 レシートを撮影／アップロード</label>
      <div class="preview" id="preview"></div><input id="receiptText" placeholder="レシート文字を貼り付けると店舗名・金額を自動入力" style="margin-top:10px;width:100%;height:42px;border:1px solid var(--line);border-radius:13px;padding:0 12px">
    </div>
    <div class="form">
      <input id="merchant" placeholder="店舗名（例：セブン-イレブン）">
      <input id="amount" type="number" min="0" placeholder="金額（JPY）">
      <select id="category"><option>食費</option><option>交通費</option><option>日用品</option><option>買い物</option><option>娯楽</option><option>宿泊</option><option>通信費</option><option>医療</option><option>仕事</option><option>その他</option></select>
      <select id="payment"><option>クレジットカード</option><option>PayPay</option><option>現金</option><option>ICカード</option></select>
      <div id="cardWrap"></div>
      <input id="note" placeholder="メモ（任意）">
      <button class="primary" id="addTxBtn">登録する</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* Safe local storage: Safari / private browsing should not kill the whole app. */
const memoryStore={};
let storageOK=true;
function load(key,fallback){
  try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}
  catch(e){storageOK=false;return Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:fallback}
}
function save(key,value){
  try{localStorage.setItem(key,JSON.stringify(value))}
  catch(e){storageOK=false;memoryStore[key]=value}
}
function remove(key){
  try{localStorage.removeItem(key)}
  catch(e){delete memoryStore[key]}
}

const TX_KEY="shiori-txs-v2", SETTINGS_KEY="shiori-settings-v2", CARDS_KEY="shiori-cards-v2";
let txs=load(TX_KEY,[]);
let settings=load(SETTINGS_KEY,{goal:0,income:0,fixed:0});
let cards=load(CARDS_KEY,[]);
let viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let period="day";

const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP");
const pad=n=>String(n).padStart(2,"0");
function monthKey(d){const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1)}
function monthText(d){return new Intl.DateTimeFormat("zh-Hant-HK",{year:"numeric",month:"long"}).format(d)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sum(list){return list.reduce((a,t)=>a+Number(t.amount||0),0)}
function monthTx(d){const k=monthKey(d);return txs.filter(t=>monthKey(t.date)===k)}
function cats(list){return list.reduce((o,t)=>{o[t.category]=(o[t.category]||0)+Number(t.amount||0);return o},{})}
const CAT_COLORS={"食費":"#7899ec","買い物":"#f2c0b2","交通費":"#91bea6","日用品":"#c5b7e7","娯楽":"#d8a9c6","宿泊":"#adb8c9","通信費":"#b9c8e6","医療":"#c7d6c9","仕事":"#d8c6a9","その他":"#dfe2e8"};

function empty(title,sub){return '<div class="empty"><div class="emptyMark">栞</div><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'}

function txHtml(t){
 const icons={"食費":"🍜","買い物":"🛍️","交通費":"🚃","日用品":"🧴","娯楽":"🎮","宿泊":"🏨","通信費":"📱","医療":"💊","仕事":"💼","その他":"◌"};
 const card=t.payment==="クレジットカード"&&t.card?" · "+esc(t.card):"";
 const dt=new Date(t.date);
 const when=isNaN(dt)?esc(t.date):dt.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
 return '<div class="tx"><div class="txIcon">'+(icons[t.category]||"◌")+'</div><div class="txBody"><b>'+esc(t.merchant)+'</b><small>'+esc(t.category)+' · '+esc(t.payment)+card+' · '+when+(t.note?" · "+esc(t.note):"")+'</small></div><div class="txAmt">'+yen(t.amount)+'</div></div>';
}

function renderDonut(list,donutId,legendId){
 const total=sum(list), el=$(donutId), legend=$(legendId), ct=cats(list);
 if(!total){el.style.background="#e5e8ee";el.dataset.total="0";legend.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999">支出データがありません</div>';return}
 let cur=0,parts=[];
 Object.keys(CAT_COLORS).forEach(c=>{const v=ct[c]||0;if(v){const start=cur;cur+=v/total*100;parts.push(CAT_COLORS[c]+" "+start+"% "+cur+"%")}});
 el.style.background="conic-gradient("+parts.join(",")+")";el.dataset.total=yen(total);
 legend.innerHTML=Object.keys(CAT_COLORS).filter(c=>ct[c]).map(c=>'<div><i class="dot" style="background:'+CAT_COLORS[c]+'"></i>'+esc(c)+'　'+Math.round(ct[c]/total*100)+'%</div>').join("");
}

function render(){
 const list=monthTx(viewMonth), total=sum(list);
 $("dateText").textContent=new Intl.DateTimeFormat("zh-Hant-HK",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
 $("homeMonth").textContent=monthText(viewMonth);$("txMonth").textContent=monthText(viewMonth);$("monthPill").textContent=monthKey(viewMonth);
 $("monthTotal").textContent=yen(total);

 const now=new Date(), today=now.toISOString().slice(0,10);
 $("dayTotal").textContent=yen(txs.filter(t=>String(t.date).slice(0,10)===today).reduce((a,t)=>a+Number(t.amount||0),0));
 const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);
 $("weekTotal").textContent=yen(txs.filter(t=>{const d=new Date(t.date);return !isNaN(d)&&d>=start}).reduce((a,t)=>a+Number(t.amount||0),0));

 const goal=Number(settings.goal||0);
 $("goalAmount").textContent=goal?yen(Math.max(0,goal-total)):"¥0";
 $("goalText").textContent=goal?"距離目標還有 "+yen(Math.max(0,goal-total)):"目標未設定";
 $("goalPct").textContent=goal?Math.min(100,Math.round(total/goal*100))+"%":"0%";
 $("goalProgress").style.width=goal?Math.min(100,total/goal*100)+"%":"0%";
 $("goalHint").textContent=goal?"目標 "+yen(goal)+" · 目前支出 "+yen(total)+"。":"貯蓄目標を設定すると、SHIORIが進捗を表示します。";

 const sorted=list.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
 $("recentTx").innerHTML=sorted.length?sorted.slice(0,4).map(txHtml).join(""):empty("まだ支出がありません","今日開始支出を記録吧。");
 $("allTx").innerHTML=sorted.length?sorted.map(txHtml).join(""):empty("這個月還沒有記録","按「＋ 支出を記録」開始。");

 renderDonut(list,"donut","legend");
 if(!list.length){$("insight").innerHTML="<p>目前沒有支出資料。開始記帳後，我會幫你找出主要支出。</p>"}
 else{const ct=cats(list),top=Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];$("insight").innerHTML="<p>今月の主な支出係 <strong>"+esc(top[0])+"</strong>，佔 "+Math.round(top[1]/total*100)+"%，合計 "+yen(top[1])+"。</p><p>今月合計有 <strong>"+list.length+"</strong> 件，1件あたり <strong>"+yen(total/list.length)+"</strong>。</p>"}

 renderMonths();renderCompare();renderAnalytics();renderCards();
 $("goalInput").value=settings.goal||"";$("incomeInput").value=settings.income||"";$("fixedInput").value=settings.fixed||"";
}

function renderMonths(){
 const current=monthKey(new Date()), keys=Array.from(new Set(txs.map(t=>monthKey(t.date))));
 if(!keys.includes(current))keys.push(current);
 keys.sort().reverse();
 $("monthList").innerHTML=keys.map(k=>{const [y,m]=k.split("-").map(Number),d=new Date(y,m-1,1),l=monthTx(d);return '<button class="monthCard" data-jump="'+k+'"><b>'+k+'</b><strong>'+yen(sum(l))+'</strong><small>'+l.length+' 件</small></button>'}).join("");
}

function renderCompare(){
 const ds=[new Date(viewMonth.getFullYear(),viewMonth.getMonth()-2,1),new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1),new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1)];
 ds.forEach((d,i)=>$("c"+i).textContent=monthKey(d));
 const labels=["総支出",...Object.keys(CAT_COLORS)];
 $("compareBody").innerHTML=labels.map(label=>{
   const vals=ds.map(d=>{const l=monthTx(d);return label==="総支出"?sum(l):(cats(l)[label]||0)});
   return "<tr><td>"+esc(label)+"</td>"+vals.map(v=>"<td>"+yen(v)+"</td>").join("")+"</tr>";
 }).join("");
}

function renderAnalytics(){
 const now=new Date();let list=[];
 if(period==="day"){const k=now.toISOString().slice(0,10);list=txs.filter(t=>String(t.date).slice(0,10)===k)}
 else if(period==="week"){const s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));s.setHours(0,0,0,0);list=txs.filter(t=>{const d=new Date(t.date);return !isNaN(d)&&d>=s})}
 else list=monthTx(viewMonth);
 const total=sum(list);
 $("aTotal").textContent=yen(total);$("aCount").textContent=String(list.length);$("aAvg").textContent=yen(list.length?total/list.length:0);
 renderDonut(list,"aDonut","aLegend");
}

function renderCards(){
 $("cards").innerHTML=cards.length?cards.map((c,i)=>'<div class="savedCard"><span>💳 '+esc(c)+'</span><button class="deleteBtn" data-remove-card="'+i+'">削除</button></div>').join(""):'<div class="empty" style="padding:20px">尚未加入クレジットカード</div>';
 updateCardSelect();
}
function updateCardSelect(){
 const wrap=$("cardWrap");
 if($("payment").value!=="クレジットカード"){wrap.innerHTML="";return}
 wrap.innerHTML='<select id="card">'+(cards.length?cards.map(c=>"<option>"+esc(c)+"</option>").join(""):'<option value="">請先到「設定」追加クレジットカード</option>')+'</select>';
}

function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function shiftMonth(delta){viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+delta,1);render()}

function openModal(){$("modal").style.display="flex";updateCardSelect()}
function closeModal(){$("modal").style.display="none"}
function resetForm(){["merchant","amount","note"].forEach(id=>$(id).value="");$("receipt").value="";$("preview").innerHTML=""}


function extractReceiptText(text){
 const s=String(text||"").replace(/\s+/g," ").trim();
 if(!s)return;
 const yenMatch=s.match(/(?:合計|お会計|計|TOTAL|Total|total)[^\d¥￥]*(?:¥|￥)?\s*([\d,]+)/i)
   || s.match(/(?:¥|￥)\s*([\d,]+)/);
 if(yenMatch && !$("amount").value)$("amount").value=yenMatch[1].replace(/,/g,"");
 const lines=String(text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(lines.length && !$("merchant").value){
   const candidate=lines.find(x=>!/^(合計|小計|税込|税|TOTAL|¥|￥|\d)/i.test(x));
   if(candidate)$("merchant").value=candidate.slice(0,50);
 }
}

function addTransaction(){
 const merchant=$("merchant").value.trim()||"未設定", amount=Number($("amount").value||0);
 if(amount<=0){alert("金額を入力してください");return}
 if($("payment").value==="クレジットカード"&&!cards.length){alert("請先到「設定」追加クレジットカード名稱。");return}
 const t={id:Date.now(),date:new Date().toISOString(),merchant,amount,category:$("category").value,payment:$("payment").value,card:$("payment").value==="クレジットカード"?($("card")?$("card").value:""):"",note:$("note").value.trim()};
 txs.unshift(t);save(TX_KEY,txs);viewMonth=new Date(new Date(t.date).getFullYear(),new Date(t.date).getMonth(),1);closeModal();resetForm();showPage("transactions");
}

function saveSettings(){
 settings={goal:Number($("goalInput").value||0),income:Number($("incomeInput").value||0),fixed:Number($("fixedInput").value||0)};
 save(SETTINGS_KEY,settings);alert("保存しました");render();
}
function addCard(){
 const name=prompt("輸入クレジットカード名稱");
 if(!name||!name.trim())return;
 cards.push(name.trim());save(CARDS_KEY,cards);render();
}
function removeCard(i){if(confirm("削除「"+cards[i]+"」？")){cards.splice(i,1);save(CARDS_KEY,cards);render()}}
function exportCSV(){
 const rows=[["date","merchant","amountJPY","category","payment","card","note"],...txs.map(t=>[t.date,t.merchant,t.amount,t.category,t.payment,t.card||"",t.note||""])];
 const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="shiori-transactions.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function resetAll(){
 if(confirm("確定要清除 SHIORI 所有交易、設定及クレジットカード資料嗎？此操作無法復原。")){
  remove(TX_KEY);remove(SETTINGS_KEY);remove(CARDS_KEY);location.reload();
 }
}

/* Event delegation = navigation keeps working even after re-render. */
document.addEventListener("click",function(e){
 const pageBtn=e.target.closest("[data-page]");if(pageBtn){showPage(pageBtn.dataset.page);return}
 const jump=e.target.closest("[data-jump]");if(jump){const [y,m]=jump.dataset.jump.split("-").map(Number);viewMonth=new Date(y,m-1,1);showPage("home");return}
 const rm=e.target.closest("[data-remove-card]");if(rm){removeCard(Number(rm.dataset.removeCard));return}
});

$("prevHome").addEventListener("click",()=>shiftMonth(-1));
$("nextHome").addEventListener("click",()=>shiftMonth(1));
$("prevTx").addEventListener("click",()=>shiftMonth(-1));
$("nextTx").addEventListener("click",()=>shiftMonth(1));
$("desktopAdd").addEventListener("click",openModal);
$("mobileAdd").addEventListener("click",openModal);
$("recordBtn").addEventListener("click",openModal);
$("closeModal").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("payment").addEventListener("change",updateCardSelect);
$("addTxBtn").addEventListener("click",addTransaction);
$("saveSettingsBtn").addEventListener("click",saveSettings);
$("addCardBtn").addEventListener("click",addCard);
$("exportBtn").addEventListener("click",exportCSV);
$("resetBtn").addEventListener("click",resetAll);

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");period=b.dataset.period;renderAnalytics();
}));

$("receipt").addEventListener("change",e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{$("preview").innerHTML='<img src="'+reader.result+'" alt="receipt">'};reader.readAsDataURL(f);
});


$("receiptText").addEventListener("input",e=>extractReceiptText(e.target.value));

/* Register the current service worker, but never let registration errors break SHIORI. */
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})});
}

render();
})();
</script>
</body>
</html>
